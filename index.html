<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1620">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Front Range">
<title>Front Range</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#0D1620;--line:#1F3042;--text:#E4ECF2;--muted:#7F93A4;--ice:#9CD3E6;--ice-dim:#4C7F93;--warm:#F0B38A;
--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;--sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:14px 20px 40px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px}
.refresh{color:var(--ice);padding:8px 0 8px 14px}
.hero{padding-top:22px}
.temp{font-family:var(--mono);font-weight:300;font-size:96px;line-height:1;letter-spacing:-4px}
.temp sup{font-size:38px;letter-spacing:0;color:var(--ice);vertical-align:top;position:relative;top:6px}
.cond{font-size:20px;margin:10px 0 8px}
.meta{font-family:var(--mono);font-size:13px;color:var(--muted);display:flex;gap:18px;flex-wrap:wrap}
.ridge{display:block;width:100%;height:auto;margin-top:18px;overflow:visible}
.gt{font-family:var(--mono);font-size:11px;fill:var(--text)}
.gx{font-family:var(--sans);font-size:10px;fill:var(--muted)}
.gcap{color:var(--muted);font-size:12px;margin:4px 0 0}
.alert{margin:16px 0 0;padding:12px 14px;border-left:2px solid var(--ice);background:rgba(156,211,230,.07);font-size:15px;line-height:1.4}
.alert.warn{border-color:var(--warm);background:rgba(240,179,138,.08)}
.rows{list-style:none;margin:10px 0 0;padding:0}
.rows li{border-top:1px solid var(--line)}
.rows li:last-child{border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr auto;gap:3px 12px;width:100%;text-align:left;padding:18px 2px}
.row .t{font-size:14px;color:var(--muted)}
.row .big{font-family:var(--mono);font-size:22px}
.row .s{font-size:15px;line-height:1.35}
.row .chev{grid-column:2;grid-row:1/4;align-self:center;color:var(--ice-dim);font-family:var(--mono);font-size:20px}
.row .t,.row .big,.row .s{grid-column:1}
.row.warn .big{color:var(--warm)}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.sheet{position:fixed;inset:0;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transform:translateX(100%);transition:transform .25s ease;z-index:20;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.bar{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);z-index:500}
.back{color:var(--ice);font-size:15px;padding:6px 0}
.bar h2{font-size:17px;font-weight:500;margin:0}
.sbody{max-width:560px;margin:0 auto;padding:6px 20px 40px}
h3{font-size:15px;font-weight:500;margin:22px 0 6px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:13px}
th{font-family:var(--sans);font-weight:400;color:var(--muted);text-align:right;padding:8px 6px;white-space:nowrap}
td{text-align:right;padding:10px 6px;border-top:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0}
td.sky{font-family:var(--sans)}
.hi{color:var(--ice);font-weight:600}
.note{color:var(--muted);font-size:13px;line-height:1.5;margin-top:14px}
.note a{color:var(--ice)}
.meter{width:70px;height:5px;background:var(--line);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle}
.meter i{display:block;height:100%;background:var(--ice)}
#map{height:62vh;border:1px solid var(--line);margin-top:14px}
.leaflet-container{background:#0D1620;font-family:var(--sans)}
.leaflet-control-attribution{background:rgba(13,22,32,.7)!important;color:var(--muted)!important}
.leaflet-control-attribution a{color:var(--muted)!important}
.scrub{display:flex;align-items:center;gap:14px;margin-top:12px;font-family:var(--mono);font-size:13px;color:var(--muted)}
.scrub button{color:var(--ice)}
</style>
</head>
<body>
<main>
  <div class="top"><span id="loc">Locating…</span><span><span id="updated"></span><button class="refresh" id="refresh">Refresh</button></span></div>
  <section class="hero" aria-live="polite">
    <div class="temp" id="temp">--</div>
    <div class="cond" id="cond">Loading conditions</div>
    <div class="meta" id="meta"></div>
    <svg class="ridge" id="graph" viewBox="0 0 400 120" role="img" aria-label="Temperature for the next 24 hours"></svg>
    <p class="gcap">Next 24 hours. Lighter bands are daylight; bars show the chance of rain or snow.</p>
  </section>
  <div id="banners"></div>
  <ul class="rows">
    <li><button class="row" data-open="commute"><span class="t">Commute</span><span class="big" id="c-big">--</span><span class="s" id="c-s">Loading</span><span class="chev">›</span></button></li>
    <li><button class="row" data-open="outside"><span class="t">Best time outside</span><span class="big" id="o-big">--</span><span class="s" id="o-s">Loading</span><span class="chev">›</span></button></li>
    <li><button class="row" data-open="snow"><span class="t">Mountain snow</span><span class="big" id="s-big">--</span><span class="s" id="s-s">Loading</span><span class="chev">›</span></button></li>
    <li><button class="row" data-open="radar"><span class="t">Radar</span><span class="big">Live</span><span class="s">Last 50 minutes, looping</span><span class="chev">›</span></button></li>
    <li><button class="row" id="a-row" data-open="airport"><span class="t">Airport status</span><span class="big" id="a-big">DEN</span><span class="s" id="a-s">Loading</span><span class="chev">›</span></button></li>
  </ul>
</main>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="stitle">
  <div class="bar"><button class="back" id="back">‹ Back</button><h2 id="stitle"></h2></div>
  <div class="sbody" id="sbody"></div>
</div>
<script>
const DT={lat:39.7475,lon:-104.9925};
const DEN={lat:39.8561,lon:-104.6737};
const MTNS=[["Loveland",39.680,-105.898,3300],["Arapahoe Basin",39.642,-105.872,3500],["Keystone",39.605,-105.954,3200],["Breckenridge",39.480,-106.066,3300],["Copper",39.502,-106.151,3250],["Vail",39.606,-106.355,3050],["Winter Park",39.887,-105.763,3100],["Steamboat",40.457,-106.804,2800],["Eldora",39.937,-105.583,2900]];
const OM='https://api.open-meteo.com/v1/forecast';
const U='&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch';
const $=s=>document.querySelector(s);
const r=Math.round;
const S={};

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const toMin=s=>+s.slice(11,13)*60+ +s.slice(14,16);
const localNow=d=>new Date(Date.now()+d.utc_offset_seconds*1000).toISOString().slice(0,16);
const addDays=(ds,n)=>{const x=new Date(ds+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const dow=ds=>new Date(ds+'T12:00:00Z').getUTCDay();
const isWk=ds=>{const w=dow(ds);return w>0&&w<6};
const wkName=(ds,f='long')=>new Date(ds+'T12:00:00Z').toLocaleDateString('en-US',{weekday:f,timeZone:'UTC'});
const dayWord=(ds,today)=>ds===today?'Today':ds===addDays(today,1)?'Tomorrow':wkName(ds);
const fmtH=h=>{h=((h%24)+24)%24;return (h%12||12)+(h<12?'am':'pm')};
const inch=v=>v<.05?'0"':v<10?v.toFixed(1)+'"':r(v)+'"';
const isSnow=c=>(c>=71&&c<=77)||c===85||c===86;
function wx(c){if(c===0)return'Clear';if(c<=2)return'Partly cloudy';if(c===3)return'Overcast';if(c<=48)return'Fog';if(c<=57)return'Drizzle';if(c<=67)return'Rain';if(c<=77)return'Snow';if(c<=82)return'Showers';if(c<=86)return'Snow showers';return'Thunderstorms'}

async function get(url,type='json'){const c=new AbortController();const t=setTimeout(()=>c.abort(),12000);try{const res=await fetch(url,{signal:c.signal});if(!res.ok)throw new Error(res.status);return type==='json'?await res.json():await res.text()}finally{clearTimeout(t)}}
function locate(){return new Promise(res=>{if(!navigator.geolocation)return res(null);navigator.geolocation.getCurrentPosition(p=>res({lat:+p.coords.latitude.toFixed(2),lon:+p.coords.longitude.toFixed(2)}),()=>res(null),{timeout:8000,maximumAge:600000,enableHighAccuracy:false})})}

/* 24-hour temperature graph */
function drawGraph(d){const h=d.hourly,dl=d.daily,nowH=localNow(d).slice(0,13)+':00';const s=Math.max(0,h.time.indexOf(nowH)),ix=[];for(let i=s;i<Math.min(s+25,h.time.length);i++)ix.push(i);
const T=ix.map(i=>h.temperature_2m[i]),lo=Math.min(...T),rg=Math.max(Math.max(...T)-lo,6),W=392/(ix.length-1);
const X=k=>4+k*W,Y=t=>84-(t-lo)/rg*58,pts=ix.map((i,k)=>[X(k),Y(h.temperature_2m[i])]);
const line='M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L');
const isDay=t=>[0,1].some(k=>dl.sunrise[k]&&t>=dl.sunrise[k].slice(0,13)+':00'&&t<dl.sunset[k]);
let g='<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9CD3E6" stop-opacity=".18"/><stop offset="1" stop-color="#9CD3E6" stop-opacity="0"/></linearGradient></defs>';
ix.forEach((i,k)=>{if(isDay(h.time[i]))g+=`<rect x="${(X(k)-W/2).toFixed(1)}" y="0" width="${W.toFixed(1)}" height="96" fill="#9CD3E6" opacity=".05"/>`});
g+=`<path d="${line} L${X(ix.length-1)},96 L4,96Z" fill="url(#g)"/>`;
ix.forEach((i,k)=>{const p=h.precipitation_probability[i]??0;if(p>=20)g+=`<rect x="${(X(k)-3).toFixed(1)}" y="${(96-p*.22).toFixed(1)}" width="6" height="${(p*.22).toFixed(1)}" fill="#9CD3E6" opacity=".5"/>`});
g+=`<path d="${line}" fill="none" stroke="#9CD3E6" stroke-width="1.4" stroke-linejoin="round"/><line x1="0" y1="96" x2="400" y2="96" stroke="#1F3042"/>`;
ix.forEach((i,k)=>{if(k%3)return;const t=h.temperature_2m[i],a=k===0?'start':k===ix.length-1?'end':'middle';g+=`<text x="${X(k)}" y="${(Y(t)-8).toFixed(1)}" text-anchor="${a}" class="gt">${r(t)}°</text><text x="${X(k)}" y="112" text-anchor="${a}" class="gx">${k?fmtH(+h.time[i].slice(11,13)):'Now'}</text>`});
g+=`<circle cx="${pts[0][0]}" cy="${pts[0][1]}" r="11" fill="#9CD3E6" opacity=".15"/><circle cx="${pts[0][0]}" cy="${pts[0][1]}" r="4" fill="#9CD3E6"/>`;
$('#graph').innerHTML=g}

/* Heads-up lines: only shown when something applies */
function headsUp(d,alerts){const h=d.hourly,s=Math.max(0,h.time.indexOf(localNow(d).slice(0,13)+':00')),end=Math.min(s+24,h.time.length),out=[],fh=i=>fmtH(+h.time[i].slice(11,13));
alerts.forEach(e=>out.push(['warn',e]));
const wet=i=>(h.precipitation_probability[i]??0)>=50&&h.weather_code[i]>=51,cur=d.current.weather_code>=51;
let a=-1;if(!cur)for(let i=s;i<end;i++)if(wet(i)){a=i;break}
if(cur||a>=0){const st=cur?s:a;let b=-1;for(let i=st+1;i<end;i++)if(!wet(i)){b=i;break}const kind=isSnow(cur?d.current.weather_code:h.weather_code[st])?'Snow':'Rain';let amt='';
if(kind==='Snow'){let v=0;for(let i=st;i<(b>=0?b:end);i++)v+=h.snowfall[i]||0;amt=v<.5?', under half an inch':`, about ${inch(v)}${cur?' more':''}`}
out.push(['info',(cur?(b>=0?`${kind} until about ${fh(b)}`:`${kind} continuing through tomorrow`):`${kind} likely from ${fh(a)}${b>=0?` to ${fh(b)}`:''}`)+amt])}
let dr=null;for(let i=s;i<Math.min(s+12,end)-3;i++){const v=h.temperature_2m[i]-h.temperature_2m[i+3];if(v>=15&&(!dr||v>dr.v))dr={v,i}}if(dr)out.push(['info',`Temps drop ${r(dr.v)}° between ${fh(dr.i)} and ${fh(dr.i+3)}`]);
let gu=null;for(let i=s;i<Math.min(s+12,end);i++){const v=h.wind_gusts_10m[i];if(v>=35&&(!gu||v>gu.v))gu={v,i}}if(gu)out.push(['info',`Gusts up to ${r(gu.v)} mph around ${fh(gu.i)}`]);
return out}

/* Current conditions */
function renderHere(d,label){const c=d.current;$('#loc').textContent=label;$('#temp').innerHTML=r(c.temperature_2m)+'<sup>°</sup>';$('#cond').textContent=wx(c.weather_code);
$('#meta').innerHTML=`<span>Feels ${r(c.apparent_temperature)}°</span><span>Wind ${r(c.wind_speed_10m)} mph</span><span>Humidity ${c.relative_humidity_2m}%</span>`;drawGraph(d)}

/* Commute */
function commuteDays(d,n){const now=localNow(d),today=now.slice(0,10);let ds=today;if(!isWk(ds)||toMin(now)>=17*60){do{ds=addDays(ds,1)}while(!isWk(ds))}const out=[ds];while(out.length<n){do{ds=addDays(ds,1)}while(!isWk(ds));out.push(ds)}return out}
function leg(h,day,hrs){const ix=hrs.map(x=>h.time.indexOf(`${day}T${pad(x)}:00`)).filter(i=>i>=0);if(!ix.length)return null;
const feel=Math.min(...ix.map(i=>h.apparent_temperature[i])),p=Math.max(...ix.map(i=>h.precipitation_probability[i]??0)),w=Math.max(...ix.map(i=>h.wind_speed_10m[i])),snow=ix.some(i=>isSnow(h.weather_code[i]));
let s=p>=50?(snow?'Snow likely, wear boots':'Rain likely, bring an umbrella'):p>=25?(snow?'Chance of snow':'Chance of rain, umbrella just in case'):'Dry walk';if(w>=20)s+=', windy';if(feel<=20)s+=', bundle up';return{feel:r(feel),s}}
function renderCommute(d){const h=d.hourly,now=localNow(d),today=now.slice(0,10),[day]=commuteDays(d,1);const pm=day===today&&toMin(now)>=8*60+15;const L=leg(h,day,pm?[16,17]:[7,8]);if(!L)return;
$('#c-big').textContent=L.feel+'°';$('#c-s').textContent=`${pm?'Walk home':'Walk in'} ${day===today?'today':wkName(day)}: ${L.s}`}
function commuteDetail(){const d=S.dt;if(!d)return fail();const h=d.hourly,today=localNow(d).slice(0,10);
return commuteDays(d,2).map(day=>{const legs=[['Walk in',[7,8]],['Walk home',[16,17]]].map(([n,hs])=>{const L=leg(h,day,hs);return L?`${n}: ${L.s.toLowerCase()}`:''}).filter(Boolean).join('. ');
return `<h3>${dayWord(day,today)}</h3><p class="note" style="margin:0 0 6px">${esc(legs)}</p><div class="wrap"><table><tr><th>Time</th><th>Temp</th><th>Feels</th><th>Precip</th><th>Wind</th><th>Sky</th></tr>${[7,8,16,17].map(x=>{const i=h.time.indexOf(`${day}T${pad(x)}:00`);return i<0?'':`<tr><td>${fmtH(x)}</td><td>${r(h.temperature_2m[i])}°</td><td>${r(h.apparent_temperature[i])}°</td><td>${h.precipitation_probability[i]??0}%</td><td>${r(h.wind_speed_10m[i])}</td><td class="sky">${wx(h.weather_code[i])}</td></tr>`}).join('')}</table></div>`}).join('')+`<p class="note">Covers your 7:30–8:15am and 4–5pm walks, Monday to Friday, in downtown Denver. Each line shows the worst conditions in that window.</p>`}

/* Best time outside */
function score(h,i){const t=h.temperature_2m[i],p=h.precipitation_probability[i]??0,cl=h.cloud_cover[i],w=h.wind_speed_10m[i];let s=100;s-=(t<62?62-t:t>80?t-80:0)*2.5;s-=p*.7;s-=cl*.25;s-=Math.max(0,w-10)*2;return Math.max(0,r(s))}
const sky=cl=>cl<25?'sunny':cl<60?'some clouds':'cloudy';
function outsideDays(d){const h=d.hourly,dl=d.daily,nowH=localNow(d).slice(0,13);return dl.time.slice(0,2).map((day,k)=>{const sr=toMin(dl.sunrise[k]),ss=toMin(dl.sunset[k]),hrs=[];
h.time.forEach((t,i)=>{if(t.slice(0,10)!==day||t.slice(0,13)<nowH)return;const m=toMin(t)+30;if(m<sr||m>ss)return;hrs.push({i,hr:+t.slice(11,13),s:score(h,i)})});return{day,hrs}})}
function bestWin(hrs){if(hrs.length===1)return{a:hrs[0],b:hrs[0],v:hrs[0].s};let b=null;for(let j=0;j<hrs.length-1;j++){const v=(hrs[j].s+hrs[j+1].s)/2;if(!b||v>b.v)b={a:hrs[j],b:hrs[j+1],v}}return b}
function renderOutside(d){const days=outsideDays(d),today=days[0].day,pick=days[0].hrs.length?days[0]:days[1];if(!pick.hrs.length)return;const w=bestWin(pick.hrs),h=d.hourly;
$('#o-big').textContent=`${fmtH(w.a.hr)}–${fmtH(w.b.hr+1)}`;$('#o-s').textContent=`${dayWord(pick.day,today)}, ${r(h.temperature_2m[w.a.i])}° and ${sky(h.cloud_cover[w.a.i])}${w.v<40?'. Not a great day out':''}`}
function outsideDetail(){const d=S.here;if(!d)return fail();const h=d.hourly,days=outsideDays(d),today=days[0].day;
return days.filter(x=>x.hrs.length).map(x=>{const w=bestWin(x.hrs);return `<h3>${dayWord(x.day,today)}</h3><div class="wrap"><table><tr><th>Time</th><th>Score</th><th>Temp</th><th>Clouds</th><th>Precip</th><th>Wind</th></tr>${x.hrs.map(o=>`<tr><td class="${o===w.a||o===w.b?'hi':''}">${fmtH(o.hr)}</td><td><span class="meter"><i style="width:${o.s}%"></i></span></td><td>${r(h.temperature_2m[o.i])}°</td><td>${h.cloud_cover[o.i]}%</td><td>${h.precipitation_probability[o.i]??0}%</td><td>${r(h.wind_speed_10m[o.i])}</td></tr>`).join('')}</table></div>`}).join('')+`<p class="note">Daylight hours only, for where you are now. The score favors 62–80°, sun, dry skies and light wind. The best two-hour window is highlighted.</p>`}

/* Mountain snow */
function snowData(raw){const arr=Array.isArray(raw)?raw:[raw];return arr.map((m,k)=>{const h=m.hourly,now=localNow(m).slice(0,13),nowT=Date.parse(now+':00Z');let l24=0,l48=0,n48=0;const daily={};
h.time.forEach((t,i)=>{const v=h.snowfall[i]||0,hr=t.slice(0,13),dh=(Date.parse(hr+':00Z')-nowT)/36e5;if(dh<=0){if(dh>-24)l24+=v;if(dh>-48)l48+=v}else{if(dh<=48)n48+=v;const dd=t.slice(0,10);daily[dd]=(daily[dd]||0)+v}});
return{name:MTNS[k][0],l24,l48,n48,days:Object.entries(daily).slice(0,7),today:now.slice(0,10)}})}
function renderSnow(list){const top=[...list].sort((a,b)=>b.n48-a.n48)[0];if(top.n48>=.5){$('#s-big').textContent=inch(top.n48);$('#s-s').textContent=`${top.name}, most in the next 48 hours`}else{const fresh=[...list].sort((a,b)=>b.l24-a.l24)[0];$('#s-big').textContent=inch(fresh.l24);$('#s-s').textContent=fresh.l24>=.5?`${fresh.name}, fresh in the last 24 hours`:'No real snow expected in the next 48 hours'}}
function powder(list){const out=[];list.forEach(m=>{if(m.l24>=6)out.push(`Fresh powder: ${m.name} got ${inch(m.l24)} in the last 24 hours`);const d=m.days.slice(0,3).find(([,v])=>v>=6);if(d)out.push(`Powder alert: ${inch(d[1])} expected at ${m.name} ${dayWord(d[0],m.today).toLowerCase()}`)});return out.slice(0,3)}
function snowDetail(){const L=S.snow;if(!L)return fail();const days=L[0].days.map(([d])=>d),today=L[0].today;const c=v=>`<td class="${v>=6?'hi':''}">${inch(v)}</td>`;
return `<h3>Totals</h3><div class="wrap"><table><tr><th>Mountain</th><th>Past 24h</th><th>Past 48h</th><th>Next 48h</th><th>Next 7d</th></tr>${L.map(m=>`<tr><td>${m.name}</td>${c(m.l24)}${c(m.l48)}${c(m.n48)}${c(m.days.reduce((a,[,v])=>a+v,0))}</tr>`).join('')}</table></div>
<h3>Day by day</h3><div class="wrap"><table><tr><th>Mountain</th>${days.map(d=>`<th>${d===today?'Today':wkName(d,'short')}</th>`).join('')}</tr>${L.map(m=>`<tr><td>${m.name}</td>${m.days.map(([,v])=>c(v)).join('')}</tr>`).join('')}</table></div>
<p class="note">Forecast at mid-mountain elevation. "Today" counts only the hours left in the day. Days with 6" or more are highlighted and trigger a powder alert on the home screen.</p>`}

/* Airport */
async function loadAirport(){const out={faa:null,alerts:[]};const[f,a]=await Promise.allSettled([get('https://nasstatus.faa.gov/api/airport-status-information','text'),get(`https://api.weather.gov/alerts/active?point=${DEN.lat},${DEN.lon}`)]);
if(f.status==='fulfilled'){const x=new DOMParser().parseFromString(f.value,'text/xml'),items=[];x.querySelectorAll('ARPT').forEach(n=>{if(n.textContent.trim()!=='DEN')return;const p=n.parentElement,q=s=>p.querySelector(s)?.textContent?.trim();
const kind={Program:'Ground stop',Ground_Delay:'Ground delay program',Delay:'Delays',Airport:'Closure'}[p.tagName]||'Delays';const extra=[q('Avg')&&`average ${q('Avg')}`,q('Min')&&q('Max')&&`${q('Min')} to ${q('Max')}`,q('End_Time')&&`until ${q('End_Time')}`].filter(Boolean).join(', ');items.push({kind,reason:q('Reason')||'',extra})});out.faa=items}
if(a.status==='fulfilled')out.alerts=(a.value.features||[]).map(x=>({event:x.properties.event,headline:x.properties.headline}));return out}
function renderAirport(A){const row=$('#a-row');if(A.faa&&A.faa.length){row.classList.add('warn');$('#a-s').textContent=`${A.faa[0].kind} at DEN`}else{row.classList.remove('warn');$('#a-s').textContent=(A.faa?'No delays at DEN':'FAA status unavailable, tap for the link')+(A.alerts.length?`. ${A.alerts[0].event}`:'')}}
function airportDetail(){const A=S.air;if(!A)return fail();let h='<h3>FAA status</h3>';
if(!A.faa)h+=`<p class="note" style="margin-top:0">Couldn’t reach the FAA feed from here. Check it directly at <a href="https://nasstatus.faa.gov" target="_blank" rel="noopener">nasstatus.faa.gov</a>.</p>`;
else if(!A.faa.length)h+=`<p style="margin:4px 0">No ground stops, delay programs or closures at DEN.</p>`;
else h+=A.faa.map(i=>`<div class="alert warn"><strong>${esc(i.kind)}</strong>${i.reason?`<br>${esc(i.reason)}`:''}${i.extra?`<br>${esc(i.extra)}`:''}</div>`).join('');
h+='<h3>Weather alerts near DEN</h3>'+(A.alerts.length?A.alerts.map(x=>`<div class="alert warn"><strong>${esc(x.event)}</strong><br>${esc(x.headline)}</div>`).join(''):'<p style="margin:4px 0">No active National Weather Service alerts.</p>');
return h+`<p class="note">FAA status covers ground stops, ground delay programs, delays and closures. Your airline’s app is still the source of truth for your specific flight.</p>`}

/* Radar */
let radar={timer:null,map:null};
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function openRadar(){openSheet('Radar',`<div id="map"></div><div class="scrub"><button id="play">Pause</button><span id="ftime"></span></div><p class="note">National Weather Service radar, last 50 minutes. Pinch to zoom.</p>`);
try{if(!window.L)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js');const here=S.pos||DT;
const map=L.map('map',{zoomControl:false}).setView([here.lat,here.lon],7);radar.map=map;
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',{attribution:'Esri',maxZoom:11}).addTo(map);
map.createPane('labels');map.getPane('labels').style.zIndex=650;map.getPane('labels').style.pointerEvents='none';
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}',{pane:'labels',maxZoom:11}).addTo(map);
const bust=Math.floor(Date.now()/3e5),frames=[50,45,40,35,30,25,20,15,10,5,0];
const layers=frames.map(m=>L.tileLayer(`https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q-900913${m?`-m${pad(m)}m`:''}/{z}/{x}/{y}.png?v=${bust}`,{opacity:0,maxZoom:11,attribution:'NEXRAD via Iowa Environmental Mesonet'}).addTo(map));
let k=layers.length-1;const show=n=>{layers.forEach((l,j)=>l.setOpacity(j===n?.75:0));$('#ftime').textContent=frames[n]?`${frames[n]} min ago`:'Now'};show(k);
const play=()=>{radar.timer=setInterval(()=>{k=(k+1)%layers.length;show(k)},700)};play();
$('#play').onclick=()=>{if(radar.timer){clearInterval(radar.timer);radar.timer=null;$('#play').textContent='Play'}else{play();$('#play').textContent='Pause'}};setTimeout(()=>map.invalidateSize(),300)}
catch(e){$('#sbody').innerHTML='<p class="note">Radar couldn’t load. Check your connection, then go back and reopen it.</p>'}}

/* Sheets */
function fail(){return'<p class="note">This section couldn’t load. Go back and tap Refresh.</p>'}
function openSheet(title,html){$('#stitle').textContent=title;$('#sbody').innerHTML=html;$('#sheet').scrollTop=0;$('#sheet').classList.add('open');if(!history.state?.sheet)history.pushState({sheet:1},'');setTimeout(()=>$('#back').focus(),50)}
function closeSheet(){$('#sheet').classList.remove('open');if(radar.timer){clearInterval(radar.timer);radar.timer=null}if(radar.map){radar.map.remove();radar.map=null}}
$('#back').onclick=()=>history.state?.sheet?history.back():closeSheet();
addEventListener('popstate',closeSheet);
const DETAIL={commute:['Commute',commuteDetail],outside:['Best time outside',outsideDetail],snow:['Mountain snow',snowDetail],airport:['Airport status',airportDetail]};
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const k=b.dataset.open;if(k==='radar')return openRadar();const[t,fn]=DETAIL[k];openSheet(t,fn())});

/* Load */
let last=0;
async function load(){last=Date.now();$('#updated').textContent='Updating… ';
const pos=await locate();S.pos=pos;const here=pos||DT;
const [h,dt,sn,air,hal]=await Promise.allSettled([
get(`${OM}?latitude=${here.lat}&longitude=${here.lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m&hourly=temperature_2m,precipitation_probability,cloud_cover,wind_speed_10m,wind_gusts_10m,weather_code,snowfall&daily=sunrise,sunset&forecast_days=2&timezone=auto${U}&models=gfs_seamless`),
get(`${OM}?latitude=${DT.lat}&longitude=${DT.lon}&hourly=temperature_2m,apparent_temperature,precipitation_probability,weather_code,wind_speed_10m&forecast_days=5&timezone=America%2FDenver${U}&models=gfs_seamless`),
get(`${OM}?latitude=${MTNS.map(m=>m[1])}&longitude=${MTNS.map(m=>m[2])}&elevation=${MTNS.map(m=>m[3])}&hourly=snowfall&past_days=2&forecast_days=7&timezone=America%2FDenver${U}`),
loadAirport(),get(`https://api.weather.gov/alerts/active?point=${here.lat},${here.lon}`)]);
const banners=[];
if(h.status==='fulfilled'){S.here=h.value;renderHere(h.value,pos?'Your location':'Downtown Denver');renderOutside(h.value)}else{$('#cond').textContent='Couldn’t load conditions. Tap Refresh.'}
if(dt.status==='fulfilled'){S.dt=dt.value;renderCommute(dt.value)}else $('#c-s').textContent='Couldn’t load';
if(sn.status==='fulfilled'){S.snow=snowData(sn.value);renderSnow(S.snow);powder(S.snow).forEach(t=>banners.push(`<div class="alert">${esc(t)}</div>`))}else $('#s-s').textContent='Couldn’t load';
if(air.status==='fulfilled'){S.air=air.value;renderAirport(air.value);(air.value.faa||[]).forEach(i=>banners.push(`<div class="alert warn">${esc(i.kind)} at DEN${i.reason?`: ${esc(i.reason)}`:''}</div>`))}
const hereAlerts=hal.status==='fulfilled'?[...new Set((hal.value.features||[]).map(x=>x.properties.event))]:[];
const hu=h.status==='fulfilled'?headsUp(h.value,hereAlerts):[];
$('#banners').innerHTML=hu.map(([k,t])=>`<div class="alert${k==='warn'?' warn':''}">${esc(t)}</div>`).join('')+banners.join('');
$('#updated').textContent='Updated '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});}
$('#refresh').onclick=load;
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-last>10*60*1000)load()});
load();
</script>
</body>
